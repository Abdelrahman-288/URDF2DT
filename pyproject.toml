[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urdf2dt"
version = "0.1.0"
description = "Constraint-aware Standard-DH frame editor for serial robots"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "casadi",
    "PyYAML",
    "defusedxml",
    "jsonschema>=4",
]

[project.optional-dependencies]
dynamics-reference = ["mujoco==3.13.0; python_version >= '3.11'"]
research = ["matplotlib>=3.8"]
desktop = [
    "PySide6>=6.6",
    "pyvista>=0.49",
    "pyvistaqt>=0.11",
    "trimesh>=4",
    "pycollada",
    "vhacdx",
]
ui = [
    "pyvista>=0.48",
    "ipywidgets",
    "pythreejs",
    "jupyterlab",
    "ipykernel",
    "nbformat",
    "nbclient",
    "trame",
    "trame-vtk>=2.11.15",
    "trame-vuetify",
    "trame-pyvista",
]
dev = [
    "pytest",
    "mypy",
    "types-PyYAML",
    "types-defusedxml",
    "jsonschema",
]

[project.urls]
Repository = "https://github.com/Abdelrahman-288/URDF2DT"

[project.gui-scripts]
urdf2dt-desktop = "urdf2dt.ui.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["urdf2dt*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Use the running interpreter's typing syntax; CI also checks Python 3.10.
check_untyped_defs = true
files = ["urdf2dt"]

[[tool.mypy.overrides]]
module = ["casadi", "scipy.spatial.transform"]
ignore_missing_imports = true
