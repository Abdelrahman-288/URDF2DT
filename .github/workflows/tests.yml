name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,research]" ipywidgets
      - name: Check dependency consistency
        run: python -m pip check
      - name: Install independent dynamics reference
        if: matrix.python == '3.12'
        run: python -m pip install -e ".[dynamics-reference,identification]"
      - name: Require independent engine for Python 3.12 checks
        if: matrix.python == '3.12'
        run: python -c "import mujoco, cvxpy, clarabel; print(mujoco.__version__, cvxpy.__version__, clarabel.__version__)"
      - name: Record installed versions
        run: python -m pip freeze > installed-dependencies.txt
      - name: Run regression and headless integration tests
        run: python -m pytest -q -ra --junitxml=test-results.xml
      - name: Type check package
        run: python -m mypy
      - name: Keep test results and dependency versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            installed-dependencies.txt
          if-no-files-found: warn
          retention-days: 14
